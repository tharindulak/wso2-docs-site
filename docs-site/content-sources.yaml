# Content lock file: every content source pinned to a commit. Changed only by reviewed pull requests
# (the bump bot opens them; see .scratch/wso2-docs-site/issues/07-content-pull-mechanism.md).
#
# kind:
#   mkdocs         one MkDocs site, rendered for its deployment_options
#   mkdocs-merge   cloud and self-hosted MkDocs sites sharing templates, merged page by page
#   docusaurus     an existing Docusaurus doc set, copied as is
# MkDocs sections sharing one source: only/skip (page path prefixes), nav_root (one top-level nav entry),
#   nav_drop (top-level entries removed), nav_pick (versioned entry -> the release shown).
# aliases: former URLs of the section's current site; links in content to hosted pages there become internal.
# cloud_companion: a cloud tree placed into this section's sidebar (placement: its nav section -> ours; rename).
# versions: (newest first) every release a section lists. Each entry has version (3 segments), ref (branch or tag), sha (40
#   characters), and optionally mkdocs/docs/sidebar/sparse overrides and exclude. Only the first (Latest) may carry track: true;
#   older versions stay pinned. Merged sections put versions: under self_hosted:.
# version_folder: for versions kept as folders on one branch, the mkdocs.yml path with {version}; a promotion writes it.
# release_tag: prefix of a version's docs-release tag; default v (v4.6.0), or <component>/v for a component's tags.
# docs_root: for components kept as version folders inside one MkDocs site, the folder with {version} (api-gateway/{version}/);
#   it becomes the section root (pages, nav: nav_root's entry for that release), and links out of it go to the section that hosts the target.
# former_route: the route the section's pages used to live under; each Latest page there redirects to its new URL.
# former_site: URL pattern of a version's former site, with {version}.
# older_versions: versions with no source in git, listed as "Older versions" links to their former docs (Confluence or a former
#   site such as ei.docs.wso2.com): { version, href (https), label (optional selector text, plain, at most 80 characters) }.
# live_window (top level): versions per section in the live build; older ones are snapshots.
# exclude: pages that do not convert yet. They redirect to current_site until fixed; the list only shrinks.
# deployment_options marked "confirm" are defaults awaiting the product catalogue confirmation (ticket 05).

# versions per section in the live build: Latest only. Latest plus previous ran out of memory in the pilot
# (.scratch/wso2-docs-site-versions/research/10-pilot-measurements.md); older versions are snapshots
live_window: 1

