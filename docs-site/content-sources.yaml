# Content lock file: every content source pinned to a commit. Changed only by reviewed pull requests
# (the bump bot opens them; see .scratch/wso2-docs-site/issues/07-content-pull-mechanism.md).
#
# kind:
#   mkdocs         one MkDocs site, rendered for its deployment_options
#   mkdocs-merge   cloud and self-hosted MkDocs sites sharing templates, merged page by page
#   docusaurus     an existing Docusaurus doc set, copied as is
# exclude: pages that do not convert yet. They redirect to current_site until fixed; the list only shrinks.
# deployment_options marked "confirm" are defaults awaiting the product catalogue confirmation (ticket 05).

