# Composite action for content repos: run the docs-site conformance check on pull requests.
# Pin it by commit SHA in the content repo's workflow. The repo needs a wso2-docs.yaml (see
# docs-site/packages/docs-converter/README.md).
name: WSO2 docs-site content check
description: Fails when pages would not convert into the WSO2 docs site; annotates the failing lines.
inputs:
  config:
    description: Path of the converter config in the content repo.
    required: false
    default: wso2-docs.yaml
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.action_path }}/../packages/docs-converter
      run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
    - shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        ROOT: ${{ github.workspace }}
        CLI: ${{ github.action_path }}/../packages/docs-converter/dist/src/cli.js
      run: node "$CLI" check --root "$ROOT" --config "$CONFIG" --format github
