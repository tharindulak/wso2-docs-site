# Build and test the docs site on every pull request that touches it. Read-only token; no secrets.
name: docs-site CI
on:
  pull_request:
    paths: ['docs-site/**', '.github/workflows/docs-site-*.yml']
  workflow_dispatch:
permissions:
  contents: read
# Same build settings as docs-site deploy, so snapshot keys match what a deploy assembles (they join the key).
env:
  DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
  DOCS_NO_INDEX: ${{ vars.DOCS_NO_INDEX }}
  DOCS_SITE_TEST_OWNER: ${{ vars.DOCS_SITE_TEST_OWNER }}
concurrency:
  group: docs-site-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # The Latest-only live build needs about 12 GB of heap and about 11 GB of disk for the merged output (pilot
    # measurements). ubuntu-latest has 16 GB RAM on public repositories but 7 GB on private ones: a private
    # repository needs a larger runner here (docs-site/README.md, Versions).
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the pilot's live build took 47 min on a 16 GB laptop
    env:
      DOCS_HEAP_MB: 12288
    defaults:
      run:
        working-directory: docs-site
    steps:
      # Sources, converted content and the build outgrow a hosted runner's free disk (about 14 GB): the runner crashed
      # with "No space left on device" in npm run content. Remove preinstalled toolchains the build never uses.
      - name: Free runner disk
        working-directory: /
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          free=$(df -Pk / | awk 'NR == 2 { print int($4 / 1048576) }')
          echo "free: ${free} GB"
          (( free >= 25 )) || { echo "less than 25 GB free" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/fetch-sources.mjs # Latest only; snapshots come from the store
      - run: npm run content
      # Hosted runners for private repositories have about 8 GB of RAM and no swap; the build ran the runner out of memory
      # (the job was reported as canceled mid-build). Swap on the freed disk lets the 12 GB heap fit; memory is logged.
      - name: Add swap
        working-directory: /
        run: |
          set -eu
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/docs-swap 2>/dev/null || sudo fallocate -l 12G /docs-swap
          f=$( [ -f /mnt/docs-swap ] && echo /mnt/docs-swap || echo /docs-swap )
          sudo chmod 600 "$f" && sudo mkswap -q "$f" && sudo swapon "$f"
          nproc; free -h; df -h / /mnt 2>/dev/null || true
      # The runner has died mid-build twice with no build error ("The operation was canceled"). Until the cause is known,
      # memory and the largest processes are printed every 20 s next to Docusaurus's phase timings.
      - name: npm run build (memory logged)
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'
        run: |
          set -eu
          ( while sleep 20; do
              echo "::group::mem $(date -u +%T)"; free -m | sed -n '2,3p'; ps -eo rss=,comm= --sort=-rss | head -4 | awk '{ printf "%7.1f GB %s\n", $1/1048576, $2 }'; echo "::endgroup::"
            done ) &
          logger=$!
          trap 'kill $logger 2>/dev/null || true' EXIT
          npm run build # scripts/docusaurus.mjs: the DOCS_HEAP_MB heap
      # Merge stored snapshots in place (saves a copy of the live build). A snapshot whose key is not stored yet
      # (changed by this PR) is a pending warning: the snapshot workflow builds it after merge.
      - run: node scripts/snapshots.mjs assemble site/build site/build --allow-missing
        env:
          SNAPSHOT_STORE: github-release:docs-site-snapshots
          GH_TOKEN: ${{ github.token }}
      # Fails on broken links that no committed baseline lists (link-baselines/: per-version files and live.json).
      - run: node scripts/check-links.mjs site/build --baselines link-baselines
