# Build and test the docs site on every pull request that touches it. Read-only token; no secrets.
name: docs-site CI
on:
  pull_request:
    paths: ['docs-site/**', '.github/workflows/docs-site-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-site-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/fetch-sources.mjs
      - run: npm run content
      - run: npx docusaurus build site
