# Build frozen versions (snapshots) whose key is not yet stored, as one matrix job each. Keys cover the version's
# lock entry, the converter, the site chrome and the navigation catalogue, so a theme change rebuilds every snapshot.
# Pull-request CI reports keys not stored yet as pending; this workflow stores them after merge.
name: docs-site snapshots
on:
  push:
    branches: [main, docs-site-build, docs-site-versions] # docs-site-build: this repository's default branch
    paths: ['docs-site/**', '.github/workflows/docs-site-*.yml']
  workflow_dispatch:
permissions:
  contents: read
# Same build settings as docs-site deploy, so snapshot keys match what a deploy assembles (they join the key).
env:
  DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
  DOCS_NO_INDEX: ${{ vars.DOCS_NO_INDEX }}
  DOCS_SITE_TEST_OWNER: ${{ vars.DOCS_SITE_TEST_OWNER }}
concurrency:
  group: docs-site-snapshots
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    defaults: { run: { working-directory: docs-site } }
    env:
      SNAPSHOT_STORE: github-release:docs-site-snapshots
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: docs-site/package-lock.json }
      - run: npm ci --ignore-scripts && npm run build:converter
      # Only keys not stored yet; a failure fails this step (not hidden inside $(...)).
      - id: list
        run: |
          m=$(node scripts/snapshots.mjs list --json --missing)
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
  # Fetch, convert and render run content code: this job has read-only permissions and never sees the write token.
  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        snapshot: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults: { run: { working-directory: docs-site } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm, cache-dependency-path: docs-site/package-lock.json }
      - run: npm ci --ignore-scripts && npm run build:converter
      - env:
          SNAPSHOT_ID: ${{ matrix.snapshot.id }}
          SNAPSHOT_STORE: local:${{ runner.temp }}/snapshots
          SNAPSHOT_BASELINE_OUT: ${{ runner.temp }}/baseline/${{ matrix.snapshot.id }}.json
        run: node scripts/snapshots.mjs build "$SNAPSHOT_ID"
      # New broken links fail the leg: upload its baseline re-recorded here (Linux: case-sensitive paths, as on the
      # server) for a reviewed PR. Nothing from this artifact is stored or deployed.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-${{ matrix.snapshot.id }}
          path: ${{ runner.temp }}/baseline/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-${{ matrix.snapshot.key }}
          # The planned key only: the build also stores an output-key copy, whose name the upload job cannot check.
          path: ${{ runner.temp }}/snapshots/${{ matrix.snapshot.key }}.tgz
          if-no-files-found: error
          retention-days: 1
  # Upload only: no checkout, no npm and no repository script runs here, so nothing the build job could have
  # modified runs with the write token. The tarball is checked by name and type before it is uploaded.
  upload:
    needs: [plan, build]
    # Per leg: one failed build leg must not stop the others from being stored (a failed leg has no artifact).
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload release assets; this job only
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        snapshot: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - id: download
        continue-on-error: true # the leg's build failed: nothing to upload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-${{ matrix.snapshot.key }}
          path: ${{ runner.temp }}/packed
      - if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ matrix.snapshot.key }}
          PACKED: ${{ runner.temp }}/packed
        run: |
          set -eu
          case "$KEY" in *[!0-9a-f]*|'') echo "invalid key" >&2; exit 1 ;; esac
          [ "${#KEY}" -eq 64 ] || { echo "invalid key length" >&2; exit 1; }
          [ "$(find "$PACKED" -type f | wc -l)" -eq 1 ] && [ -f "$PACKED/$KEY.tgz" ] && [ ! -L "$PACKED/$KEY.tgz" ] \
            || { echo "artifact must hold exactly $KEY.tgz" >&2; exit 1; }
          gh release view docs-site-snapshots --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create docs-site-snapshots --repo "$GITHUB_REPOSITORY" --prerelease --title "docs-site snapshots" --notes "Build output of frozen docs versions, by key. Do not edit." \
            || gh release view docs-site-snapshots --repo "$GITHUB_REPOSITORY" >/dev/null
          # Same key means same content: a parallel run having stored it first is success.
          if gh release view docs-site-snapshots --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$KEY.tgz"; then
            echo "stored   ${KEY:0:12}"
          else
            # A parallel run storing the same key between the check and the upload is success.
            if gh release upload docs-site-snapshots "$PACKED/$KEY.tgz" --repo "$GITHUB_REPOSITORY"; then echo "uploaded ${KEY:0:12}"
            elif gh release view docs-site-snapshots --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$KEY.tgz"; then echo "stored   ${KEY:0:12}"
            else exit 1; fi
          fi
