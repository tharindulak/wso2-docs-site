# Hourly: move every content source to the head of its tracked branch. The PR auto-merges once
# "docs-site CI" passes (branch protection must require it). No tokens live in content repos.
name: docs-site content bump
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: docs-site-content-bump
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Bump pinned commits
        id: bump
        run: |
          node scripts/bump-sources.mjs --bumps --write --json "$RUNNER_TEMP/bump.json"
          if git diff --quiet -- content-sources.yaml; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open or update the bump pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          branch="bot/content-bump"
          git config user.name "docs-site-bot"
          git config user.email "docs-site-bot@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "Bump content sources" -m "$(node -e 'const r=require(process.argv[1]);console.log(r.bumps.map(b=>`${b.repo}: ${b.compare}`).join("\n"))' "$RUNNER_TEMP/bump.json")"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          body="Automated content bump. Compare links are in the commit message. Merges automatically when docs-site CI passes."
          gh pr view "$branch" --repo "$REPO" >/dev/null 2>&1 || gh pr create --repo "$REPO" --head "$branch" --title "Bump content sources" --body "$body" --label content-bump
          gh pr merge "$branch" --repo "$REPO" --auto --squash
