# Hourly: move every Latest content source to the head of its tracked branch and every listed version to its newest docs fix release. The PR auto-merges once
# "docs-site CI" passes (branch protection must require it). No tokens live in content repos.
name: docs-site content bump
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: docs-site-content-bump
  cancel-in-progress: false
# The lock may pin forks (test copies outside the wso2 organization); scripts/lib.mjs accepts their owner from this.
env:
  DOCS_SITE_TEST_OWNER: ${{ vars.DOCS_SITE_TEST_OWNER }}
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --ignore-scripts && npm run build:converter # bump-sources.mjs imports helpers from the converter package (built, not committed)
      - name: Bump pinned commits
        id: bump
        run: |
          node scripts/bump-sources.mjs --bumps --write --json "$RUNNER_TEMP/bump.json"
          if git diff --quiet -- content-sources.yaml; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open or update the bump pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          branch="bot/content-bump"
          git config user.name "docs-site-bot"
          git config user.email "docs-site-bot@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "Bump content sources" -m "$(node -e 'const r=require(process.argv[1]);console.log([...r.bumps.map(b=>`${b.repo}: ${b.compare}`),...r.fixes.map(f=>`${f.section} ${f.version}: docs fix release ${f.tag}`)].join("\n"))' "$RUNNER_TEMP/bump.json")"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          body="Automated content bump: Latest moves to the head of its tracked branch (bumps), and listed versions move to a newer docs fix release such as v4.6.0.1 (fixes). Compare links and fix tags are in the commit message. Merges automatically when docs-site CI passes."
          gh pr view "$branch" --repo "$REPO" >/dev/null 2>&1 || gh pr create --repo "$REPO" --head "$branch" --title "Bump content sources" --body "$body" --label content-bump
          gh pr merge "$branch" --repo "$REPO" --auto --squash
