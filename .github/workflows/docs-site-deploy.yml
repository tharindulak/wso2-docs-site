# Deploy the docs site: pages to Cloudflare R2, served by the Worker in docs-site/hosting/cloudflare/; search on the
# docs VM (docs-site/hosting/). Decided in .scratch/wso2-docs-site-delivery/issues/07-deploy-workflow-spec.md, with
# hosting moved to Cloudflare (one copy in R2, updated in place, to stay within R2's free storage):
#   plan     gate key, no repository code: what is live, what to deploy, or nothing to do
#   build    read-only token, the R2 key and the VM upload key (it runs content code): build, check, publish the pages to
#            R2 in place, upload the search records to the VM as a release folder
#   promote  gate key, no repository code: the gate indexes search on the VM and moves the alias
# The R2 key is limited to the site's bucket, but publishing in place means the build job changes the live site: the
# old rule that a build job cannot go live holds only for search. Rollback: dispatch with an older commit (a full
# deploy). The Typesense admin key never leaves the VM.
#
# Environment (DEPLOY_ENVIRONMENT, default test) secrets: DEPLOY_HOST, DEPLOY_KNOWN_HOSTS, DEPLOY_SSH_KEY (upload),
# DEPLOY_GATE_KEY, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY (Object Read & Write on the bucket only).
# Repository variables: R2_BUCKET, DOCS_SITE_URL (the Worker's address), DOCS_NO_INDEX, DOCS_SITE_TEST_OWNER (test
# copies only) and ALLOW_MISSING_SNAPSHOTS=true (test only, until the snapshot store is filled: Latest only, flagged
# in the release).
name: docs-site deploy
on:
  workflow_run:
    workflows: ['docs-site snapshots']
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: '40-character commit on the default branch (default: its head; an older one rolls back)'
        type: string
        required: false
  schedule:
    - cron: '23 3 * * *' # daily backstop; a run with nothing new stops in plan
permissions:
  contents: read
concurrency:
  group: docs-site-deploy # deploys never overlap; a newer pending run replaces an older one
  cancel-in-progress: false
env:
  DEPLOY_USER: deploy
jobs:
  plan:
    # A snapshots run counts only when it succeeded on a push to the default branch of this repository: workflow_run
    # always runs in the default branch's context, so environment branch rules alone would not stop a PR's run.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'test' }}
    outputs:
      commit: ${{ steps.what.outputs.commit }}
      id: ${{ steps.what.outputs.id }}
      skip: ${{ steps.what.outputs.skip }}
    steps:
      - name: Connect to the gate
        env:
          KEY: ${{ secrets.DEPLOY_GATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          [[ $HOST =~ ^[A-Za-z0-9.-]+$ ]] || { echo "DEPLOY_HOST is not a host name or address" >&2; exit 1; }
          umask 077
          printf '%s\n' "$KEY" >"$RUNNER_TEMP/gate_key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/known_hosts"
          echo "GATE=ssh -i $RUNNER_TEMP/gate_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o ConnectTimeout=20 $DEPLOY_USER@$HOST" >>"$GITHUB_ENV"
      - id: live
        name: What is live
        run: |
          set -eu
          $GATE current | tee "$RUNNER_TEMP/current"
          grep -E '^(id|commit|free_gb)=[A-Za-z0-9-]*$' "$RUNNER_TEMP/current" >>"$GITHUB_OUTPUT"
      - id: what
        name: What to deploy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_COMMIT: ${{ inputs.commit }}
          LIVE_COMMIT: ${{ steps.live.outputs.commit }}
        run: |
          set -eu
          branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          case $EVENT in
            workflow_run) sha=$RUN_SHA ;;
            *) sha=${INPUT_COMMIT:-$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" --jq .sha)} ;;
          esac
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be 40 lowercase hex characters" >&2; exit 1; }
          # On the default branch: the branch is the commit itself or ahead of it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$branch" --jq .status)
          [[ $status == identical || $status == ahead ]] || { echo "$sha is not on $branch ($status)" >&2; exit 1; }
          echo "commit=$sha" >>"$GITHUB_OUTPUT"
          echo "id=$(date -u +%Y%m%dT%H%M%SZ)-${sha:0:7}" >>"$GITHUB_OUTPUT"
          if [[ $sha == "$LIVE_COMMIT" ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "Nothing to deploy: \`${sha:0:12}\` is already live." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - if: always()
        run: rm -f "$RUNNER_TEMP/gate_key"

  build:
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    # The Latest-only build needs about 12 GB of heap and about 11 GB of disk for the merged output: a public
    # repository's ubuntu-latest (16 GB RAM) after removing preinstalled toolchains. A private one needs a larger runner.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'test' }}
    env:
      DOCS_HEAP_MB: 12288
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      DOCS_NO_INDEX: ${{ vars.DOCS_NO_INDEX }}
      DOCS_SITE_TEST_OWNER: ${{ vars.DOCS_SITE_TEST_OWNER }}
      ID: ${{ needs.plan.outputs.id }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Free runner disk
        working-directory: /
        run: |
          set -eu
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          free=$(df -Pk / | awk 'NR == 2 { print int($4 / 1048576) }')
          echo "free: ${free} GB"
          (( free >= 25 )) || { echo "less than 25 GB free" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --ignore-scripts && npm run build:converter
      - run: node scripts/fetch-sources.mjs # Latest only; snapshots come from the store
      - run: npm run content
      # Rspack (Docusaurus Faster's bundler, native code outside the JS heap and DOCS_HEAP_MB) took about 24 GB bundling
      # some 10,000 pages and keeps it through page rendering: a 16 GB runner with 12 GB swap ran out and was killed
      # (reported as "canceled"). 32 GB of swap on the freed disk (about 80 GB free) covers it.
      - name: Add swap
        working-directory: /
        run: |
          set -eu
          sudo swapoff -a || true
          sudo fallocate -l 32G /mnt/docs-swap 2>/dev/null || sudo fallocate -l 32G /docs-swap
          f=$( [ -f /mnt/docs-swap ] && echo /mnt/docs-swap || echo /docs-swap )
          sudo chmod 600 "$f" && sudo mkswap -q "$f" && sudo swapon "$f"
          nproc; free -h; df -h / /mnt 2>/dev/null || true
      - run: npm run build # scripts/docusaurus.mjs: the DOCS_HEAP_MB heap
        env:
          DOCUSAURUS_SSG_WORKER_THREAD_COUNT: '2' # fewer page-rendering threads: slower growth on top of rspack's memory
      # A deploy needs every snapshot stored. ALLOW_MISSING_SNAPSHOTS (test only) deploys Latest without the missing ones.
      - id: assemble
        env:
          SNAPSHOT_STORE: github-release:docs-site-snapshots
          GH_TOKEN: ${{ github.token }}
          ALLOW_MISSING: ${{ vars.ALLOW_MISSING_SNAPSHOTS }}
        run: |
          set -eu
          if [[ $ALLOW_MISSING == true ]]; then
            node scripts/snapshots.mjs assemble site/build site/build --allow-missing
            echo "partial=true" >>"$GITHUB_OUTPUT"
            echo "Snapshots not yet stored were left out (ALLOW_MISSING_SNAPSHOTS)." >>"$GITHUB_STEP_SUMMARY"
          else
            node scripts/snapshots.mjs assemble site/build site/build
            echo "partial=false" >>"$GITHUB_OUTPUT"
          fi
      - run: node scripts/check-links.mjs site/build --baselines link-baselines
      - name: Release files
        env:
          PARTIAL: ${{ steps.assemble.outputs.partial }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          node scripts/search-index.mjs site/build --release
          jq -n --arg id "$ID" --arg commit "$COMMIT" --arg run "$RUN_URL" --arg built "$(date -u +%FT%TZ)" \
            --argjson partial "$PARTIAL" '{id: $id, commit: $commit, built_at: $built, run: $run, snapshots_missing: $partial}' \
            >site/build/.release.json
      - name: Install rclone
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          zip=rclone-v1.75.1-linux-amd64.zip
          curl -fsSLO "https://downloads.rclone.org/v1.75.1/$zip"
          echo "982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab  $zip" | sha256sum -c -
          unzip -q -j "$zip" '*/rclone' -d bin && echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Publish the pages to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -eu
          [[ $ACCOUNT =~ ^[0-9a-f]{32}$ ]] || { echo "R2_ACCOUNT_ID is not a Cloudflare account id" >&2; exit 1; }
          [[ $BUCKET =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo "R2_BUCKET is not a bucket name" >&2; exit 1; }
          export RCLONE_CONFIG_R2_ENDPOINT="https://$ACCOUNT.r2.cloudflarestorage.com"
          # In place, ordered so a page never links to a file not yet uploaded: non-HTML files (content-hashed assets
          # among them) first, then pages, then deletions. --checksum: Docusaurus rewrites every mtime, so only content
          # decides what is sent. Dot files and _search/ never go to R2 (the Worker refuses them too), and a
          # search-config.json in the bucket is left alone (the Worker answers it from its settings when they are set).
          filters=(--exclude '.*' --exclude '.*/**' --exclude '/_search/**' --exclude '/search-config.json')
          opts=(--checksum --fast-list --transfers 32 --checkers 32 --stats 60s --stats-one-line)
          rclone copy site/build "r2:$BUCKET" "${opts[@]}" "${filters[@]}" --exclude '*.html'
          rclone copy site/build "r2:$BUCKET" "${opts[@]}" "${filters[@]}"
          rclone sync site/build "r2:$BUCKET" "${opts[@]}" "${filters[@]}"
          echo "Published commit \`${COMMIT:0:12}\` to R2 bucket \`$BUCKET\`." >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the search records
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          [[ $HOST =~ ^[A-Za-z0-9.-]+$ ]] || { echo "DEPLOY_HOST is not a host name or address" >&2; exit 1; }
          umask 077
          printf '%s\n' "$KEY" >"$RUNNER_TEMP/upload_key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/known_hosts"
          ssh="ssh -i $RUNNER_TEMP/upload_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o ConnectTimeout=20"
          # A release folder on the VM now holds only what the gate needs to index search: _search/ and .release.json.
          rsync -r --checksum --chmod=D755,F644 --include=/_search/ --include='/_search/**' --include=/.release.json --exclude='*' \
            -e "$ssh" site/build/ "$DEPLOY_USER@$HOST:$ID/"
          : >"$RUNNER_TEMP/.release-complete"
          rsync --chmod=F644 -e "$ssh" "$RUNNER_TEMP/.release-complete" "$DEPLOY_USER@$HOST:$ID/.release-complete"
          echo "Uploaded the search records as release \`$ID\`." >>"$GITHUB_STEP_SUMMARY"
      - if: always()
        working-directory: /
        run: rm -f "$RUNNER_TEMP/upload_key"

  promote:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'test' }}
    steps:
      # The gate indexes the release's search records, moves the alias and records the release as live (what plan reads
      # next time). The pages are already live: the build job published them.
      - name: Switch search
        env:
          KEY: ${{ secrets.DEPLOY_GATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          ID: ${{ needs.plan.outputs.id }}
        run: |
          set -eu
          [[ $HOST =~ ^[A-Za-z0-9.-]+$ ]] || { echo "DEPLOY_HOST is not a host name or address" >&2; exit 1; }
          [[ $ID =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7}$ ]] || { echo "bad release id" >&2; exit 1; }
          umask 077
          printf '%s\n' "$KEY" >"$RUNNER_TEMP/gate_key"
          printf '%s\n' "$KNOWN_HOSTS" >"$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/gate_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20 "$DEPLOY_USER@$HOST" "switch $ID" | tee "$RUNNER_TEMP/out"
          { echo "### Search switch"; echo '```'; cat "$RUNNER_TEMP/out"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -f "$RUNNER_TEMP/gate_key"
